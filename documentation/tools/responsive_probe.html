<!DOCTYPE html>
<!--
  Responsive probe harness.

  The automation viewport is only 800px wide, so desktop breakpoints cannot be
  exercised directly. Media queries inside an iframe resolve against the
  iframe's own width, so loading index.html into a set of fixed-width frames
  gives a real measurement at each breakpoint.

  Open /tools/responsive_probe.html and read the table. Not part of the site.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Responsive probe — SonicSentinel AI docs</title>
<style>
  body { font: 13px ui-monospace, Consolas, monospace; background: #0A0F1C; color: #E6EDF7; margin: 0; padding: 20px; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  p.sub { margin: 0 0 18px; color: #8494AC; font-size: 12px; }
  table { border-collapse: collapse; margin-bottom: 22px; min-width: 100%; }
  caption { text-align: left; color: #38E8C6; font-size: 12px; padding: 6px 0; }
  th, td { border: 1px solid #22304A; padding: 4px 8px; text-align: left; font-size: 12px; white-space: nowrap; }
  th { color: #8494AC; font-weight: 500; }
  td.bad { color: #FF5470; }
  td.good { color: #38E8C6; }
  .frame { position: absolute; left: -99999px; top: 0; border: 0; }
</style>
</head>
<body>
<h1>Responsive probe</h1>
<p class="sub">Loads <code>../index.html</code> into fixed-width frames and reports the measured column system at each breakpoint.</p>
<div id="out">measuring…</div>

<script>
const WIDTHS = [1440, 1280, 1080, 1024, 900, 768, 600, 420];

function probe(w) {
  return new Promise(resolve => {
    const f = document.createElement("iframe");
    f.className = "frame";
    f.width = w;
    f.height = 900;
    f.src = "../index.html";
    f.onload = () => {
      const d = f.contentDocument, win = f.contentWindow;
      const px = n => Math.round(n * 10) / 10;
      const box = sel => {
        const el = d.querySelector(sel);
        if (!el) return null;
        const r = el.getBoundingClientRect();
        return { x: px(r.x), w: px(r.width) };
      };

      // character width of the body face, for a real "ch" measure
      const probeSpan = d.createElement("span");
      probeSpan.style.cssText = "position:absolute;visibility:hidden;white-space:pre;font:" +
        win.getComputedStyle(d.body).fontSize + " " + win.getComputedStyle(d.body).fontFamily;
      probeSpan.textContent = "0".repeat(100);
      d.body.appendChild(probeSpan);
      const chPx = probeSpan.getBoundingClientRect().width / 100;
      probeSpan.remove();

      const para = box("#read p:not(.sec-note)");
      const canvases = ["ensCanvas", "sevCanvas", "dsCanvas"].map(id => {
        const cv = d.getElementById(id);
        if (!cv) return { id, missing: true };
        const px2 = cv.getContext("2d").getImageData(0, 0, cv.width, cv.height).data;
        let ink = 0;
        for (let i = 3; i < px2.length; i += 4) if (px2[i] > 8) ink++;
        return { id, ink, w: cv.width };
      });

      const railVisible = (() => {
        const r = box(".rail");
        return r ? r.x >= 0 : false;
      })();

      resolve({
        w,
        rail: box(".rail"),
        railVisible,
        h2x: box("#read h2")?.x,
        paraX: para?.x,
        noteX: box("#read .note")?.x,
        tableX: box("#verified .status")?.x,
        bayX: box(".bay")?.x,
        bayW: box(".bay")?.w,
        measureCh: para ? px(para.w / chPx) : null,
        preW: box("#evidence pre")?.w,
        overflowX: d.documentElement.scrollWidth > win.innerWidth,
        canvases
      });
      f.remove();
    };
    d0.appendChild(f);
  });
}

const d0 = document.body;
(async () => {
  const rows = [];
  for (const w of WIDTHS) rows.push(await probe(w));
  const cols = ["w", "railVisible", "h2x", "paraX", "noteX", "tableX", "bayX", "bayW", "measureCh", "preW", "overflowX"];
  let html = "<table><caption>column system</caption><tr>" +
    cols.map(c => `<th>${c}</th>`).join("") + "</tr>";
  for (const r of rows) {
    html += "<tr>" + cols.map(c => {
      const v = r[c];
      const bad = (c === "overflowX" && v === true) || (c === "measureCh" && v && (v < 45 || v > 80));
      return `<td class="${bad ? "bad" : ""}">${v === undefined ? "—" : v}</td>`;
    }).join("") + "</tr>";
  }
  html += "</table><table><caption>canvas ink (0 = blank)</caption><tr><th>width</th><th>ens</th><th>sev</th><th>ds</th></tr>";
  for (const r of rows) {
    html += "<tr><td>" + r.w + "</td>" + r.canvases.map(c =>
      `<td class="${c.missing || c.ink === 0 ? "bad" : "good"}">${c.missing ? "missing" : c.ink}</td>`).join("") + "</tr>";
  }
  html += "</table>";
  document.getElementById("out").innerHTML = html;
  window.__probe = rows;
})();
</script>
</body>
</html>
